name: Regression tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai_vocal_coach/requirements.txt
      - run: pip install -r ai_vocal_coach/requirements.txt pytest
      - run: pytest -q
