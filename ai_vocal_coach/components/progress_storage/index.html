<!doctype html><html lang="en"><meta charset="utf-8"><script>
(() => {
  const key='vocal-coach-progress-v1';let loaded=false,last=null;
  const send=(type,payload={})=>parent.postMessage({isStreamlitMessage:true,type,...payload},'*');
  window.addEventListener('message',event=>{
    if(event.source!==parent||event.data?.type!=='streamlit:render')return;
    const args=event.data.args||{};
    try {
      if(!loaded){
        loaded=true;const raw=localStorage.getItem(key);let data=null;
        if(raw&&raw.length<2000000){try{data=JSON.parse(raw);}catch(_){}}
        send('streamlit:setComponentValue',{value:{loaded:true,data},dataType:'json'});
        return;
      }
      if(!args.ready)return;
      if(args.enabled){const value=JSON.stringify(args.data);if(value!==last){localStorage.setItem(key,value);last=value;}}
      else{localStorage.removeItem(key);last=null;}
    }catch(_){send('streamlit:setComponentValue',{value:{loaded:true,unavailable:true},dataType:'json'});}
  });
  send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:0});
})();
</script></html>
